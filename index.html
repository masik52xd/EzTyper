<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--bg:#0c0714;--card:#150d22;--tx:#e3def2;--mu:#8e869c;--ac:#7a4bf5;--r:10px;--bl:0px;--bgi:none;--bd:rgba(128,128,128,.25);--ef:15px;--pf:16px;--ff:Consolas,monospace;--pff:'Segoe UI',sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background-color:var(--bg);background-image:var(--bgi);background-attachment:fixed;color:var(--tx);font:14px 'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.glass{background:var(--card);backdrop-filter:blur(var(--bl)) saturate(1.5);-webkit-backdrop-filter:blur(var(--bl)) saturate(1.5);border:1px solid var(--bd);border-radius:var(--r)}
#bar,#tabs,#st{display:flex;gap:6px;align-items:center;margin:6px 8px 0;padding:6px;flex-wrap:wrap}
#tabs{flex-wrap:nowrap;overflow-x:auto;padding:4px}
button,select,input{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:calc(var(--r)*.7);padding:6px 10px;cursor:pointer}
#bar button{display:inline-flex;align-items:center}#bar button b{font-weight:400;margin-right:6px}
button:hover{border-color:var(--ac);color:var(--ac)}
.tab{display:flex;gap:8px;white-space:nowrap;align-items:center;padding:6px 10px;border-radius:calc(var(--r)*.7);cursor:pointer;color:var(--mu)}
.tab.on{background:var(--ac);color:#fff}
.tab i{font-style:normal;opacity:.6}
#main{flex:1;display:flex;gap:8px;margin:6px 8px;min-height:0}
.pane{flex:1;min-width:0;position:relative;overflow:hidden;display:flex}
#gut{overflow:hidden;color:var(--mu);text-align:right;font:var(--ef)/1.6 var(--ff);padding:0 8px;border-right:1px solid var(--bd);user-select:none;min-width:2.5em}
#gi{will-change:transform}
#ed{flex:1;color:var(--tx);caret-color:var(--ac);resize:none;border:0;border-radius:0;background:transparent;outline:0;font:var(--ef)/1.6 var(--ff);tab-size:4;cursor:text;min-width:0}
#mir{position:absolute;visibility:hidden;left:-9999px;top:0;padding:0}
#pv{display:none;overflow:auto;overflow-wrap:anywhere;word-break:break-word;padding:16px 24px;font:var(--pf)/1.6 var(--pff)}
#pv h1,#pv h2,#pv h3{color:var(--ac)}#pv code{background:var(--bd);padding:1px 5px;border-radius:4px}
#pv pre{background:var(--bd);padding:10px;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere}#pv p{margin:.5em 0}#pv blockquote{border-left:3px solid var(--ac);margin:8px 0;padding-left:12px;color:var(--mu)}#pv a{color:var(--ac)}
body.pv #pv{display:block}
#st{color:var(--mu);justify-content:space-between}
dialog{color:var(--tx);max-width:560px;width:92%;max-height:86vh;overflow:auto;padding:18px;background:var(--bg);background-image:var(--bgi);border:1px solid var(--bd);border-radius:var(--r)}
dialog::backdrop{background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0}
.row input[type=number]{width:90px}
.hp h1,.hp h2,.hp h3{color:var(--ac)}
/* Metro: Windows 8.1 tiles */
[data-th=metro]{--r:0px;--bd:#555;font-family:'Segoe UI',sans-serif}
[data-th=metro] #bar,[data-th=metro] #tabs{background:transparent;border:0;padding:0;gap:6px}
[data-th=metro] #bar{align-items:flex-start}
[data-th=metro] #bar button{width:96px;height:96px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;padding:8px 10px;border:0;border-radius:0;color:#fff;font-size:12px;transition:transform .12s}
[data-th=metro] #bar button b{font-size:32px;font-weight:300;margin:0}
[data-th=metro] #bar button[data-a=pomo]{width:198px}
[data-th=metro] #bar button:nth-of-type(1){background:#1ba1e2}[data-th=metro] #bar button:nth-of-type(2){background:#00a300}[data-th=metro] #bar button:nth-of-type(3){background:#e3a21a}[data-th=metro] #bar button:nth-of-type(4){background:#d80073}[data-th=metro] #bar button:nth-of-type(5){background:#7e3878}[data-th=metro] #bar button:nth-of-type(6){background:#00aba9}[data-th=metro] #bar button:nth-of-type(7){background:#008299}[data-th=metro] #bar button:nth-of-type(8){background:#647687}[data-th=metro] #bar button:nth-of-type(9){background:#825a2c}
[data-th=metro] #bar button:hover{color:#fff;outline:2px solid rgba(255,255,255,.45)}
[data-th=metro] #bar button:active{transform:scale(.94)}
[data-th=metro] .tab{border-radius:0;background:#3a3a3d;color:#ddd}
[data-th=metro] .tab.on{background:var(--ac);color:#fff}
/* Liquid Glass */
[data-th=liquid] .glass{box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 8px 28px rgba(0,0,0,.3)}
[data-th=liquid] button{background:rgba(255,255,255,.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
[data-th=liquid] .tab.on{background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
[data-th=liquid] dialog{background:rgba(16,18,36,.8);backdrop-filter:blur(30px)}
/* Slides Deck */
[data-th=slides] #pv h1,[data-th=slides] #pv h2{font-family:Georgia,serif}
[data-th=slides] .pane{box-shadow:0 10px 30px rgba(40,30,90,.18)}
[data-th=slides] .tab.on{border-bottom:3px solid var(--ac);background:#fff;color:var(--ac)}
[data-th=slides] #pv{background:linear-gradient(180deg,#fff,#f4f1ff);font-size:calc(var(--pf)*1.1)}
@keyframes inR{from{transform:translateX(60px);opacity:0}}
@keyframes inL{from{transform:translateX(-60px);opacity:0}}
.sR{animation:inR .35s cubic-bezier(.2,.8,.2,1)}.sL{animation:inL .35s cubic-bezier(.2,.8,.2,1)}
body.pv #pv{animation:inR .3s}
@media(max-width:700px){#main{flex-direction:column}body.pv #ep{display:none}body.pv #pv{flex:1}}
</style>
